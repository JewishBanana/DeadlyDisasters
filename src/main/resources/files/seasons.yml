###############################################################################################################################################################################
#
# Realistic Seasons
#
# If you are using the plugin RealisticSeasons then this file will be auto-generated. You can enable and disable different features within this file, keep in mind that this 
# config is shared for all worlds and not individually configured.
#
###############################################################################################################################################################################

general:
    # If realistic seasons should take any affect on Deadly Disasters. Changing this setting will require a server restart to take affect!
    enabled: true
    # The maximum temperature players can be at for blizzards to affect them. This uses the Realistic Seasons temperature for players.
    blizzard_temperature_threshold: -1

###############################################################################################################################################################################
#
# Disaster Season Settings
#
# You can control what seasons specific disasters can occur in. This uses the Realistic Seasons world season. Each disaster is listed below and has its own list of seasons 
# which represent the seasons that the disaster can naturally occur on players. There is no need to remove all seasons to disable a disaster, you can simply disable disasters 
# within the worlds disaster config file. The option 'ALL' has also been added for simplicity to represent all seasons.
#
###############################################################################################################################################################################

disasters:
    sinkhole:
    - ALL
    cavein:
    - ALL
    earthquake:
    - ALL
    geyser:
    - ALL
    tornado:
    - SPRING
    - SUMMER
    tsunami:
    - SPRING
    - SUMMER
    - FALL
    black_plague:
    - SPRING
    - SUMMER
    - FALL
    acid_storm:
    - SPRING
    - SUMMER
    - FALL
    blizzard:
    - WINTER
    extreme_winds:
    - SPRING
    - FALL
    sandstorm:
    - SPRING
    - SUMMER
    meteor_shower:
    - SUMMER
    - FALL
    supernova:
    - ALL
    hurricane:
    - SPRING
    - SUMMER
    - FALL
    purge:
    - FALL
    - WINTER
    solar_storm:
    - SPRING
    - SUMMER
