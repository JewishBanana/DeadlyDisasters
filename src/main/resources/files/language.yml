                level_5: "&eAn &cextremely large &egroup of mobs have contracted the %disaster% &enear &6%player%"
                level_6: "(hex:#8f0000)The %disaster% (hex:#8f0000)is running rampant near &6%player%"
            plague_catch: "You have caught the %disaster%"
            cure_message: "You feel relief as you recover from the %disaster%!"
        purge:
            started:
                level_1: "&cA &avery small &cHorde is assembling, &6%player% &cwill be purged..."
                level_2: "&cA &2small &cHorde is assembling, &6%player% &cwill be purged..."
                level_3: "&cA &blarge &cHorde is assembling, &6%player% &cwill be purged..."
                level_4: "&cA &every large &cHorde is assembling, &6%player% &cwill be purged..."
                level_5: "&cAn (hex:#ff1c1c)extremely large &cHorde is assembling, &6%player% &cwill be purged..."
                level_6: "(hex:#8f0000)The entire Horde is assembling, &6%player% (hex:#8f0000)will be purged..."
            ended: "&eThe horde is clearing up..."
