###############################################################################################################################################################################
#
# LANGUAGE
#
# Language: English (CA)
# By: JewishBanana
#
# This is the language file for the plugin. Here you can modify many different messages from the plugin, you can also modify the names of disasters, custom items, etc. 
# There are many different place holders that can be added or removed in various messages, they are encapsulated with '%' signs and fairly self explanatory to understand. 
# Place holders are typically unique to their specific message so don't use them in messages they are not already present in! You can also remove them from any message you wish.
#
# You can also translate to a different language the plugins messages. All characters must be in standard UTF-8 encoding! You may also find translations of this file in other 
# languages on the discord server in the translations chat. If you are translating this file into another language and are willing to share please let me know on the discord!
# Remember, if translating only translate the actual values and not the keys! So only translate what is in quotations ("") and on the right side of the colon (:).
#
# Discord: https://discord.gg/MhXFj72VeN
# 
###############################################################################################################################################################################

messages:
    internal:
        update_notify_console: "&aA new version of this plugin is available!\n&7- Current version: &c&l%version%\n&7- New version: &6&l%newversion%\n&bUpdate now at &d%webpage%"
        update_notify_player: "&aA new version of this plugin is available! Notify the server operator to update.\n&7- Current version: &c&l%version%\n&7- New version: &6&l%newversion%"
        flight_kick: "&cThis plugin works best when &d'allow-flight' &cis set to &atrue &cin the server-properties file!"
    commands:
        console_error_message: "&cUnable to execute command from console!"
        permission_error: "&cYou do not have permission to use that!"
        disabled_disaster: "&cThis disaster is disabled in this world!"
        help:
            start: "&6Usage: &d/disasters start <disaster> [level] [player|x y z] [world]\n&7The start command is used to start disasters on players.\n&c<disaster> &8- &7The disaster to start.\n&e[level] &8- &7The level of the disaster.\n&e[player | x y z] &8- &7The player to start the disaster on, or the XYZ coordinates of where the disaster should start at (e.g. 'Steve' or '120 63 -458').\n&e[world] &8- &7The world of where this disaster should start. This should only defined if using coordinates or starting from console."
            stop: "&6Usage: &d/disasters stop [disaster] [world]\n&7This command will stop any current ongoing disasters immediately.\n&e[disaster] &8- &7The type of disaster to stop.\n&e[world] &8- &7The world to stop disasters in. This will only stop the specified disaster within this world."
            regenerate: "&6Usage: &d/disasters regenerate [world] [disaster]\n&7This command will immediately regenerate disasters that are currently regenerating.\n&e[world] &8- &7The world to regenerate. This means all disaster damage on this specified world will immediately regenerate.\n&e[disaster] &8- &7The type of disaster to regenerate. This means that only damage from this specific type of disaster will immediately regenerate."
            fastRegenerate: "&6Usage: &d/disasters fastRegenerate [world] [disaster]\n&7This command will immediately regenerate disasters that are currently regenerating. The difference between this and the regular regenerate, is that the fast regenerate will not update block physics significantly improving the regeneration speed, but may leave floating blocks and other minor glitches afterward.\n&e[world] &8- &7The world to regenerate. This means all disaster damage on this specified world will immediately regenerate.\n&e[disaster] &8- &7The type of disaster to regenerate. This means that only damage from this specific type of disaster will immediately regenerate."
            config:
                config: "&6Usage: &d/disasters config <reload|set|enable|disable|setting|list>...\n&7This command allows you to view, or change config settings directly in the game. To see a more specific help section, type the next argument into the help command (e.g. '/disasters help config setting')."
                reload: "&6Usage: &d/disasters config reload\n&7This command will reload all configs for DeadlyDisasters."
                set: "&6Usage: &d/disasters config set <world> <config>\n&7This command is used to attach a config file to a world meaning that the world will use disaster settings from the attached config file.\n&c<world> &8- &7The world to attach the config file to.\n&c<config> &8- &7The config file to attach to the world. This is the config file that is placed in the worldConfigs folder in the plugins directory!"
                enable: "&6Usage: &d/disasters config enable <disaster> [world]\n&7This command will enable the specified disaster or category in either the world the player has run it from, or the specified world. This will directly modify the worlds attached config file!\n&c<disaster> &8- &7The disaster type or category to enable.\n&e[world] &8- &7The world to enable the disaster in."
                disable: "&6Usage: &d/disasters config disable <disaster> [world]\n&7This command will disable the specified disaster or category in either the world the player has run it from, or the specified world. This will directly modify the worlds attached config file!\n&c<disaster> &8- &7The disaster type or category to disable.\n&e[world] &8- &7The world to disable the disaster in."
                setting: "&6Usage: &d/disasters config setting <option> <value> [world]\n&7This command will directly modify the config setting in either the world the player has run it from, or the specified world. This will directly modify the worlds attached config file!\n&c<option> &8- &7The config setting to change. This will match the exact config line and tab completion options will show what is available to be changed.\n&c<value> &8- &7The value to change the setting to. This expects the matching data type from the config data types, an error will be received if the data type was incompatible.\n&e[world] &8- &7The world to change the setting in."
                list: "&6Usage: &d/disasters config list\n&7This command will list all worlds and their attached config files."
            blacklist: "&6Usage: &d/disasters blacklist <add|remove> <player> [world]\n&7This command will add or remove a player from the blacklist on either the world the player has run it from, or a specified world. Disasters do not naturally occur on blacklisted players! This command can be run for offline players.\n&c<add | remove> &8- &7To either add, or remove the player from the blacklist.\n&c<player> &8- &7The target player to add or remove.\n&e[world] &8- &7The world to add or remove the player from the blacklist. Disasters will not naturally occur on blacklisted players in the world."
            timers: "&6Usage: &d/disasters timers <listworlds|listplayer> [player]\n&7This command will either list all worlds global disaster timer countdowns (countdown till next disaster in seconds), or players individual disaster timer countdowns. This command will can be run for offline players.\n&c<listworlds | listplayer> &8- &7To either list the worlds global timer countdowns, or players indiviudal countdowns.\n&3[<player>] &8- &7This argument is required if you have chosen the listplayer option. This will list the current individual disaster countdowns for this target player."
            unrecognized: "&cUnrecognized command argument"
