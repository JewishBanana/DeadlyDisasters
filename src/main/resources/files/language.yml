    tips:
        sinkhole: "&7Tip: The ground around you becomes unstable, try placing blocks below you to stop falling."
        earthquake: "&7Tip: Sneaking can really help during these, also try boxing yourself in."
        tornado: "&7Tip: Always carry a water bucket with you. Stay indoors and patch holes."
        water_geyser: "&7Tip: Water geysers are made of boiling hot water, do not touch them. Fire resistance will protect you."
        lava_geyser: "&7Tip: Lava geysers appear deep underground. The deeper you are, the faster it will reach you."
        cavein: "&7Tip: Avoid cramped caves with low roofs."
        supernova: "&7Tip: Run."
        tsunami: "&7Tip: Tsunamis only happen near deep water. They do not reach very deep, you may be able to dive under them."
        hurricane: "&7Tip: Hurricanes only appear in tropical biomes or oceans. Take shelter, and patch holes."
        infested_cave: "&7Tip: Avoid breaking the infestation, it will regenerate, and might let it know where you are..."
        landslide: "&7Tip: Try not to stay in one spot or you will get buried."
        acid_storm: "&7Tip: Seek immediate shelter to avoid the acid rain; metal items and armor will melt incredibly fast."
        extreme_winds: "&7Tip: Strong winds do not affect you inside shelter, just watch out for the walls being torn."
        sandstorm: "&7Tip: Sandstorms only appear in desert biomes. If you get caught in one, don't stop running."
        blizzard: "&7Tip: Blizzards only appear in cold biomes. Wearing leather armor will help with the cold, standing close to strong heat sources also prevents freezing."
        soul_storm: "&7Tip: Lost souls can travel through walls so shelter won't help you."
        meteor_shower: "&7Tip: Meteors fall on the surface and typically do not penetrate many blocks, try going deep underground."
        monsoon: "&7Tip: Monsoons have such heavy rainfall that you cannot breathe in them. As the water level rises, drowned leave the ocean."
        end_storm: "&7Tip: Take shelter. Try to slay void mobs as they appear from rifts to avoid crowding."
        solar_storm: "&7Tip: Standing near heat sources can ignite you! During solarstorms all fires last twice as long."
        black_plague: "&7Tip: Avoid making contact with any mobs; if you see black particles near a mob, it means they are infected."
        purge: "&7Tip: Try getting to high ground where most mobs cannot reach. Beware of Tunnellers."
    features:
        purge_boss_bar_title: "&fHorde"
