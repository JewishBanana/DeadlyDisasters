        extreme_winds:
            level_1: "&aVery light &fWinds &6are approaching around: &a%location% &e(%player%)"
            level_2: "&bLight &fWinds &6are approaching around: &a%location% &e(%player%)"
            level_3: "&9Strong &fWinds &6are approaching around: &a%location% &e(%player%)"
            level_4: "&eVery strong &fWinds &6are approaching around: &a%location% &e(%player%)"
