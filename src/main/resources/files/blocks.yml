###############################################################################################################################################################################
#
# BLOCK RESISTANCES FILE
#
# This file controls the resistance to disasters of different block types. By default all block types have a resistance of 0, this means that they will always be destroyed by 
# disasters which attempt to destroy/displace them. Block resistance ranges from 0.0-1.0 where a value of 1.0 means the block is fully immune to disasters. For organizational  
# purposes I added a string list at the top to list immune block types (All this does is sets the blocks resistance to 1.0). The rest of the blocks are listed in sub section 
# categories. There is additionally a large collection of bukkit tag categories which are also used and available to list in this file, although keep in mind that if you 
# set a bukkit category, any directly referenced block types from the category you list separately will override the categories resistance setting! Since the bukkit tags are 
# missing lots of desired categories, I have also created a set of custom categories which can also be used in this file. All of the custom categories are listed below in this 
# file while to see the bukkit categories you will need to check the link below. Also, all of the sub sections used are just for organizational purposes and don't actually 
# affect any functionality. You can create your own with any name or use any sub section to list any block types you want anywhere in this file, even outside of any section.
#
###############################################################################################################################################################################
#
# All Bukkit Tag Categories: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Tag.html
#
# CUSTOM CATEGORIES
#
#   "stone_stairs" - Represents all stone type stairs.
#
###############################################################################################################################################################################

# This is a special setting that makes all block types immune to disasters (Some people requested it).
protect_all_blocks: false

# This is a list of all immune block types (resistance value = 1.0). You could also manually set each type to 1.0, this list just keeps it organized.
immune_types:
- bedrock
- end_portal_frame
- end_portal
- command_blocks

